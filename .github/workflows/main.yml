name: Daily StockVN Backtest Update

on:
  schedule:
    # Chạy lúc 11:40 trưa giờ Việt Nam (04:40 UTC) từ T2 đến T6
    - cron: '40 4 * * 1-5'
    
    # Chạy lúc 15:10 chiều giờ Việt Nam (08:10 UTC) từ T2 đến T6
    - cron: '10 8 * * 1-5'
    
  workflow_dispatch: # Cho phép anh bấm nút Run thủ công trên Github hoặc nút Cập nhật trên Web Dashboard

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Main Script
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/*.csv
          git add backtest_results.json
          git commit -m "Auto-update stock data and backtest results" || echo "No changes to commit"
          git push
